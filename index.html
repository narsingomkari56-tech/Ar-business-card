<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
  <title>NEON AR Business Card</title>

  <!-- Load A-Frame and AR.js from reliable CDNs -->
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ar.js@3.4.0/aframe/build/aframe-ar-nft.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
    }
    #loader {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.2em;
      z-index: 9999;
    }
  </style>
</head>
<body>

  <!-- Full-screen loader -->
  <div id="loader">
    Loading NEON Marker...
  </div>

  <!-- AR Scene -->
  <a-scene
    vr-mode-ui="enabled: false"
    arjs="sourceType: webcam; trackingMethod: best; debugUIEnabled: false;"
    renderer="logarithmicDepthBuffer: true"
    embedded>

    <!-- NFT Marker (uses NEON.fset, NEON.iset, NEON.fset.jpeg from same folder) -->
    <a-nft url="NEON" smooth="true">
      <!-- 3D Object: Rotating Cyan Box -->
      <a-box 
        position="0 0 0" 
        scale="40 40 40" 
        color="#00ffff" 
        opacity="0.8"
        animation="property: rotation; to: 0 360 0; dur: 4000; easing: linear; loop: true">
      </a-box>

      <!-- Optional: Text Label -->
      <a-text 
        value="NEON AR" 
        position="0 60 0" 
        color="white" 
        scale="50 50 50"
        align="center">
      </a-text>
    </a-nft>

    <a-entity camera></a-entity>
  </a-scene>

  <!-- ✅ SCRIPT AT THE BOTTOM — AFTER ALL HTML -->
  <script>
    // Wait for DOM to be ready
    document.addEventListener('DOMContentLoaded', () => {
      const loader = document.getElementById('loader');
      const scene = document.querySelector('a-scene');

      if (!loader || !scene) {
        console.error('AR elements not found!');
        return;
      }

      // Hide loader when A-Frame scene is loaded
      scene.addEventListener('loaded', () => {
        console.log('A-Frame scene loaded. Hiding loader in 1.5s...');
        setTimeout(() => {
          if (loader) loader.style.display = 'none';
        }, 1500);
      });

      // Optional: Log NFT events
      scene.addEventListener('arjs-nft-loaded', () => {
        console.log('✅ NFT marker loaded successfully!');
      });
      scene.addEventListener('arjs-nft-error', (e) => {
        console.error('❌ NFT error:', e.detail);
      });
    });
  </script>
</body>
</html>
