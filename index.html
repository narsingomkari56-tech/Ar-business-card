<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
  <title>NEON AR Business Card</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <!-- AR.js NFT (fixed CORS) -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@master/aframe/build/aframe-ar-nft.js"></script>

  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; }
    #loader {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9); color: white;
      display: flex; justify-content: center; align-items: center;
      font-size: 1.2em; z-index: 9999;
    }
  </style>
</head>
<body>
  <div id="loader">Loading NEON Marker...</div>

  <a-scene
    vr-mode-ui="enabled: false"
    arjs="sourceType: webcam; trackingMethod: best; debugUIEnabled: false; detectionMode: mono;"
    renderer="logarithmicDepthBuffer: true"
    embedded>

    <a-nft url="NEON" smooth="true">
      <a-box position="0 0 0" scale="40 40 40" color="#00ffff" opacity="0.8"
            animation="property: rotation; to: 0 360 0; dur: 4000; easing: linear; loop: true">
      </a-box>
      <a-text value="NEON AR" position="0 60 0" color="white" scale="50 50 50" align="center"></a-text>
    </a-nft>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const loader = document.getElementById('loader');
      const scene = document.querySelector('a-scene');

      if (!loader || !scene) return;

      scene.addEventListener('loaded', () => {
        setTimeout(() => {
          if (loader) loader.style.display = 'none';
        }, 2000);
      });

      scene.addEventListener('arjs-nft-loaded', () => console.log('✅ NFT loaded'));
      scene.addEventListener('arjs-nft-error', e => console.error('❌', e.detail));
    });
  </script>
</body>
</html>
