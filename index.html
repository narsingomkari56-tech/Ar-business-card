<script>
  const scene = document.querySelector('a-scene');
  const loader = document.getElementById('loader');

  // Show debug logs
  scene.addEventListener('loaded', () => {
    console.log('A-Frame scene loaded');
    // Wait a bit for AR.js to initialize NFT
    setTimeout(() => {
      loader.style.display = 'none';
      console.log('Loader hidden');
    }, 2000);
  });

  // Optional: Log AR.js events
  scene.addEventListener('arjs-nft-loaded', () => {
    console.log('✅ NFT loaded!');
  });
  scene.addEventListener('arjs-nft-error', (e) => {
    console.error('❌ NFT error:', e.detail);
    loader.innerHTML = '<div style="color:red">NFT Error: Check console</div>';
  });
</script>
