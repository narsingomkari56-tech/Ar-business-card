<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
  <title>T-Rex AR</title>

  <!-- ✅ Updated A-Frame (1.4.0) -->
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <!-- ✅ Clean AR.js NFT script (no spaces!) -->
  <script src="https://cdn.jsdelivr.net/npm/ar.js@3.4.0/aframe/build/aframe-ar-nft.js"></script>

  <style>
    body { margin: 0; overflow: hidden; }
    #loader {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9); color: white;
      display: flex; justify-content: center; align-items: center;
      font-size: 1.2em; z-index: 9999;
    }
  </style>
</head>
<body>
  <div id="loader">Loading T-Rex...</div>

  <a-scene
    vr-mode-ui="enabled: false"
    arjs="sourceType: webcam; trackingMethod: best;"
    renderer="logarithmicDepthBuffer: true"
    embedded>

    <!-- ✅ Relative path (files in same folder) -->
    <a-nft url="./Trex" smooth="true">
      <a-box 
        position="0 0 0" 
        scale="40 40 40" 
        color="green" 
        opacity="0.6"
        animation="property: rotation; to: 0 360 0; dur: 4000; easing: linear; loop: true">
      </a-box>
    </a-nft>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    setTimeout(() => {
      document.getElementById('loader').style.display = 'none';
    }, 2500);
  </script>
</body>
</html>
