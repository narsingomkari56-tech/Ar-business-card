<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
  <title>Hiro Test</title>

  <!-- A-Frame + Standard AR.js (for Hiro) -->
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ar.js@3.4.0/aframe/build/aframe-ar.js"></script>

  <style>
    body { margin: 0; overflow: hidden; }
    #loader {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9); color: white;
      display: flex; justify-content: center; align-items: center;
      font-size: 1.2em; z-index: 9999;
    }
  </style>
</head>
<body>
  <div id="loader">Point camera at Hiro marker...</div>

  <a-scene
    vr-mode-ui="enabled: false"
    arjs="sourceType: webcam; debugUIEnabled: false;"
    renderer="logarithmicDepthBuffer: true"
    embedded>

    <!-- Hiro Marker (built-in) -->
    <a-marker preset="hiro">
      <a-box 
        position="0 0 0" 
        scale="0.5 0.5 0.5" 
        color="#ff00ff" 
        opacity="0.8"
        animation="property: rotation; to: 0 360 0; dur: 4000; easing: linear; loop: true">
      </a-box>
      <a-text value="HIRO WORKS!" position="0 1 0" color="white" align="center"></a-text>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        const loader = document.getElementById('loader');
        if (loader) loader.style.display = 'none';
      }, 2000);
    });
  </script>
</body>
</html>
