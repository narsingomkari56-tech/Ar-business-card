<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no"
  />

  <title>NFT AR – Stable Final</title>

  <!-- A-Frame (stable for AR.js NFT) -->
  <script src="https://aframe.io/releases/1.0.2/aframe.min.js"></script>

  <!-- AR.js NFT build -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar-nft.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
      font-family: Arial, sans-serif;
    }

    #loader {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      font-size: 1.1rem;
    }
  </style>
</head>

<body>

  <div id="loader">Loading NFT marker…</div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="antialias: true; logarithmicDepthBuffer: true;"
    arjs="
      sourceType: webcam;
      trackingMethod: best;
      debugUIEnabled: false;
    "
  >

    <!-- NFT MARKER -->
    <a-nft
      type="nft"
      url="Trex/Trex"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5"
    >

      <!-- TEST OBJECT -->
      <a-box
        position="0 0 0"
        scale="40 40 40"
        material="color: green; opacity: 0.7"
        animation="
          property: rotation;
          to: 0 360 0;
          dur: 4000;
          easing: linear;
          loop: true;
        "
      ></a-box>

    </a-nft>

    <!-- CAMERA -->
    <a-entity camera></a-entity>

  </a-scene>

  <script>
    const loader = document.getElementById("loader");
    const scene = document.querySelector("a-scene");

    scene.addEventListener("arjs-nft-loaded", () => {
      console.log("✅ NFT descriptors loaded");
      loader.style.display = "none";
    });

    // Fallback (camera still shows)
    setTimeout(() => {
      loader.style.display = "none";
    }, 5000);
  </script>

</body>
</html>
