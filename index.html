<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, user-scalable=no">
  <title>Hiro Test</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <!-- Standard AR.js (for Hiro) -->
  <script src="https://cdn.jsdelivr.net/npm/ar.js@3.4.0/aframe/build/aframe-ar.js"></script>

  <style> body { margin: 0; overflow: hidden; } </style>
</head>
<body>
  <!-- Simple loader -->
  <div id="loader" style="position:absolute;top:0;left:0;width:100%;height:100%;background:black;color:white;display:flex;align-items:center;justify-content:center;">
    Point at Hiro Marker...
  </div>

  <!-- AR Scene with explicit arjs -->
  <a-scene 
    arjs="sourceType: webcam; debugUIEnabled: false;"
    renderer="logarithmicDepthBuffer: true"
    vr-mode-ui="enabled: false"
    embedded>

    <a-marker preset="hiro">
      <a-box position="0 0.5 0" scale="0.5 0.5 0.5" color="magenta" depth="0.5" height="0.5" width="0.5"></a-box>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // Hide loader after 2 seconds
    setTimeout(() => {
      const loader = document.getElementById('loader');
      if (loader) loader.style.display = 'none';
    }, 2000);
  </script>
</body>
</html>
