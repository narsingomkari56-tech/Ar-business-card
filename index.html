<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
  <title>Trex AR Final Fix</title>

  <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
  
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; }
    
    #loader {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9); color: white;
      display: flex; justify-content: center; align-items: center;
      font-size: 1.2em; z-index: 9999;
    }
  </style>
</head>

<body>
  <div id="loader">Loading Trex Mark...</div>

  <a-scene
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true;"
    embedded
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;">

    <a-nft 
      type="nft" 
      url="./Trex" 
      smooth="true" 
      smoothCount="10" 
      smoothTolerance=".01" 
      smoothThreshold="5">
      
        <a-box 
            position="50 150 0" 
            scale="100 100 100" 
            material="color: green; opacity: 0.6;"
            animation="property: rotation; to: 0 360 0; dur: 4000; easing: linear; loop: true">
        </a-box>

    </a-nft>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const loader = document.getElementById('loader');
      const scene = document.querySelector('a-scene');

      if (!loader || !scene) return;

      // Force hide loader after 3 seconds so you can see the camera
      setTimeout(() => {
        loader.style.display = 'none';
        console.log("Force hiding loader...");
      }, 3000);

      scene.addEventListener('arjs-nft-loaded', () => {
          console.log('✅ NFT Descriptors Loaded!');
      });
    });
  </script>
</body>
</html>
